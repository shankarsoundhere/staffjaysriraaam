<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>झारकिला लेबर</title>

<style>
body{
  font-family:Arial, sans-serif;
  margin:10px;
}

h3{
  text-align:center;
  margin:5px 0 12px;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

td{
  border:1px solid #000;
  padding:5px 3px;
  text-align:center;
  font-size:11px;
  height:32px;
  white-space:nowrap;
  overflow:hidden;
}

/* 🔥 सिर्फ main table का header grey */
.main-table tr:first-child td{
  background:#d3d3d3;
  font-weight:bold;
}

/* पहला column */
td:first-child{
  width:18%;
}

/* बाकी column */
td:not(:first-child){
  width:13.66%;
}

/* NOTE हमेशा white रहेगा */
.note td{
  height:60px;
  text-align:left;
  vertical-align:top;
  padding:10px;
  white-space:normal;
  font-size:13px;
  background:#fff !important; /* 🔥 force white */
}

.printBox{
  text-align:center;
  margin-top:15px;
}

button{
  padding:8px 18px;
  border:none;
  background:#28a745;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

@media print{
  .printBox{
    display:none;
  }
}
</style>
</head>

<body>

<h3>👷 झारकिला लेबर</h3>

<table class="main-table">
<tr>
<td>दिनांक</td>
<td>नाम 1</td>
<td>नाम 2</td>
<td>नाम 3</td>
<td>नाम 4</td>
<td>नाम 5</td>
<td>नाम 6</td>
</tr>

<tr>
<td>12-05-2056</td>
<td>राहुल</td>
<td>राहुल</td>
<td>राहुल</td>
<td>राहुल</td>
<td>राहुल</td>
<td>राहुल</td>
</tr>

<tr>
<td>@@-@@-@@@@</td>
<td></td>
<td></td>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>

<tr>
<td>@@-@@-@@@@</td>
<td></td>
<td></td>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>
</table>

<h4>Note</h4>

<table class="note">
<tr>
<td>
<ul>
<li>---------</li>
</ul>
</td>
</tr>
</table>

<div class="printBox">
<button onclick="window.print()">🖨 Print</button><br>
<a href="index.html">⬅ वापस जाए</a>
</div>

</body>
</html>
