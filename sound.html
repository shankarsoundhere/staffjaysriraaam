<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shankar Tent House</title>
<link rel="manifest" href="manifest.json">

    <!-- Optional but important -->
    <link rel="icon" href="favicon.png">
    <link rel="apple-touch-icon" href="icon-192.png">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 10px;
    background: white;
    color: black;
}

/* Main Container */
.container {
    width: 100%;
    max-width: 1400px;
    margin: auto;
    overflow-x: auto;
}

/* LED Board */
.led-board {
    width: 100%;
    min-width: 600px;
    overflow: hidden;
    white-space: nowrap;
    background: black;
    padding: 15px 0;
    margin-bottom: 20px;
    border-radius: 10px;
}

.led-text {
    display: inline-block;
    font-size: 36px;
    font-weight: bold;
    animation: scrollText 12s linear infinite;
}

@keyframes scrollText {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
}

.saffron { color: orange; }
.white { color: white; }
.green { color: #00ff00; }

/* NEW: Table container for scroll */
.table-container {
    width: 100%;
    overflow-x: auto;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;   /* fixed नहीं रखना */
}

th, td {
    padding: 6px 4px;
    border: 1px solid #ddd;
    font-size: 13px;
}

/* 1st column center */
th:nth-child(1), td:nth-child(1) {
    text-align: center;
}

/* 2nd & 3rd column left */
th:nth-child(2), td:nth-child(2),
th:nth-child(3), td:nth-child(3) {
    text-align: left;
    padding-left: 8px;
}

th, td {
    white-space: nowrap;   /* line break रोक देगा */
}

th {
    background: #4facfe;
    color: white;
    font-size: 40px;
}

tr {
    cursor: pointer;
    transition: 0.3s;
}

tr:nth-child(even) {
    background: #f2f2f2;
}

tr:hover {
    background: #ddd;
}

/* Mobile Responsive */
@media(max-width:600px){
    .led-text { font-size: 18px; }

    th, td { 
        font-size: 11px; 
        padding: 6px; 
    }
}
</style>

</head>

<body>

<div class="container">

<div class="led-board">
    <div class="led-text">
        <span class="saffron">शंकर टेंट हाउस</span> 
        <span class="white">लखीसराय</span> 
        <span class="green">7004814456 , 6200164687</span>
    </div>
</div>

<table>

<tr>
    <th>दिनांक</th>
    <th>काम</th>
    <th>कहां जाएगा</th>
</tr>

<tr onclick="window.open('https://drive.google.com/file/d/1c4jkVE-Y-FXpB3aBVFWnEg7OoTwDtAgl/view?usp=drivesdk','_blank')">
<td>22-06-2026</td>
<td>रथ</td>
<td>इंदुपुर</td>
</tr>

<tr onclick="window.open('https://drive.google.com/file/d/1ZSc1E8hj2C5YAkeW9pk-3Pzte8PCHbst/view?usp=drivesdk','_blank')">
<td>24-06-2026</td>
<td>रथ</td>
<td>जॉयस से चित्तौरा</td>
</tr>

<tr onclick="window.open('https://drive.google.com/file/d/1-Ep90n8Cuzt0sJtK-IDnFolIO7iazmSj/view?usp=drivesdk','_blank')">
<td>25-06-2026</td>
<td>D.J, रथ, झारकिला</td>

</body>
</html>
