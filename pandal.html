<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पंडाल मिस्त्री</title>

<style>
body { font-family: Arial; margin:10px; }

table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
}

td {
    border: 1px solid black;
    padding: 10px;
    text-align: left;
    font-size: 13px;
}

/* Note section */
.note td {
    height: 50px;
    vertical-align: top;
}

ul{
    margin:0;
    padding-left:20px;
}
</style>
</head>

<body>

<h3 align="center">🎪 पंडाल मिस्त्री</h3>

<!-- 🔥 ऊपर Note (Bullet) -->
<table>
<tr>
<td>
<ul>
<li>--------------------------</li>
</ul>
</td>
</tr>
</table>

<!-- नीचे वाला Note -->
<h4>📝 नोट प्वाइंट</h4>

<table class="note">
<tr>
<td>

<ul>
<li>----</li>
</ul>

</td>
</tr>
</table>

<center>
<a href="index.html">⬅ वापस जाए</a>
</center>

</body>
</html>
